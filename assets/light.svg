<svg width="1180" height="610"
viewBox="0 0 1180 610"
xmlns="http://www.w3.org/2000/svg">

<defs>

<radialGradient id="bg">
<stop stop-color="#ffffff"/>
<stop offset="1" stop-color="#f8fafc"/>
</radialGradient>


<linearGradient id="accent">
<stop stop-color="#2563EB">
<animate attributeName="stop-color"
values="#2563EB;#06B6D4;#10B981;#2563EB"
dur="8s"
repeatCount="indefinite"/>
</stop>

<stop offset="1"
stop-color="#06B6D4">

<animate attributeName="stop-color"
values="#06B6D4;#10B981;#2563EB;#06B6D4"
dur="8s"
repeatCount="indefinite"/>

</stop>
</linearGradient>


<filter id="shadow">
<feDropShadow
dx="0"
dy="12"
stdDeviation="20"
flood-opacity=".15"/>
</filter>


<filter id="glow">
<feGaussianBlur stdDeviation="10"/>
</filter>


<linearGradient id="scan">
<stop stop-color="#2563EB" stop-opacity="0"/>
<stop offset=".5"
stop-color="#06B6D4"
stop-opacity=".18"/>
<stop offset="1"
stop-color="#2563EB"
stop-opacity="0"/>
</linearGradient>


</defs>


<!-- Background -->

<rect width="1180"
height="610"
rx="35"
fill="url(#bg)"/>



<!-- Ambient Glow -->

<circle cx="1000"
cy="120"
r="170"
fill="#2563EB"
opacity=".08"
filter="url(#glow)">

<animate attributeName="cy"
values="120;170;120"
dur="7s"
repeatCount="indefinite"/>

</circle>



<!-- ASCII PANEL -->

<rect x="45"
y="60"
width="360"
height="480"
rx="28"
fill="#F8FAFC"
stroke="#e2e8f0"
filter="url(#shadow)"/>


<text x="75"
y="150"
font-size="18"
font-family="monospace"
fill="url(#accent)">

<tspan>
 █████╗ ██████╗
</tspan>

<tspan x="75" dy="35">
██╔══██╗██╔══██╗
</tspan>

<tspan x="75" dy="35">
███████║██║  ██║
</tspan>

<tspan x="75" dy="35">
██╔══██║██║  ██║
</tspan>

<tspan x="75" dy="35">
██║  ██║██████╔╝
</tspan>

<tspan x="75" dy="35">
╚═╝  ╚═╝╚═════╝
</tspan>


<animate attributeName="opacity"
values="0;1"
dur="3s"/>

</text>



<text x="90"
y="390"
font-family="monospace"
font-size="18"
fill="#475569">

&lt; developer.mode /&gt;


<animateTransform
attributeName="transform"
type="translate"
values="0 0;0 -10;0 0"
dur="5s"
repeatCount="indefinite"/>

</text>



<!-- TERMINAL -->

<rect x="450"
y="60"
width="680"
height="480"
rx="28"
fill="#ffffff"
stroke="#e2e8f0"
filter="url(#shadow)"/>



<circle cx="490"
cy="100"
r="8"
fill="#ef4444"/>

<circle cx="520"
cy="100"
r="8"
fill="#facc15"/>

<circle cx="550"
cy="100"
r="8"
fill="#22c55e"/>



<text x="600"
y="110"
font-size="16"
font-family="monospace"
fill="#64748b">

aditya@github-profile

</text>




<text x="500"
y="170"
font-family="monospace"
font-size="28"
fill="#0f172a">

Hi 👋


<tspan x="500"
dy="45"
fill="url(#accent)">

I'm Aditya Saxena

</tspan>

</text>




<text x="500"
y="280"
font-family="monospace"
font-size="22"
fill="#2563EB">

Full Stack Developer

<animate attributeName="opacity"
values="1;.3;1"
dur="2s"
repeatCount="indefinite"/>

</text>




<text x="500"
y="340"
font-family="monospace"
font-size="18"
fill="#475569">

Java • Node.js • MongoDB • JavaScript

</text>




<text x="500"
y="390"
font-family="monospace"
font-size="18"
fill="#475569">

Building scalable web applications_

<animate attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>

</text>




<!-- Scan -->

<rect width="1180"
height="80"
fill="url(#scan)"
opacity=".5">

<animate attributeName="y"
values="-80;610"
dur="5s"
repeatCount="indefinite"/>

</rect>




<!-- Border -->

<rect x="10"
y="10"
width="1160"
height="590"
rx="35"
fill="none"
stroke="url(#accent)"
stroke-width="2">

<animate attributeName="stroke-opacity"
values=".3;1;.3"
dur="4s"
repeatCount="indefinite"/>

</rect>


</svg>