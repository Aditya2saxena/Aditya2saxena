<svg width="1180" height="610" viewBox="0 0 1180 610"
xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- Background Gradient -->
<radialGradient id="bg">
<stop offset="0%" stop-color="#1e293b"/>
<stop offset="55%" stop-color="#030712"/>
<stop offset="100%" stop-color="#020617"/>
</radialGradient>

<!-- Accent Gradient -->
<linearGradient id="accent">
<stop stop-color="#7C3AED">
<animate attributeName="stop-color"
values="#7C3AED;#22D3EE;#10B981;#7C3AED"
dur="8s" repeatCount="indefinite"/>
</stop>

<stop offset="1" stop-color="#22D3EE">
<animate attributeName="stop-color"
values="#22D3EE;#10B981;#7C3AED;#22D3EE"
dur="8s" repeatCount="indefinite"/>
</stop>
</linearGradient>


<filter id="glow">
<feGaussianBlur stdDeviation="8"/>
</filter>


<filter id="shadow">
<feDropShadow dx="0" dy="10"
stdDeviation="20"
flood-opacity=".35"/>
</filter>


<!-- Scanline -->
<linearGradient id="scan">
<stop stop-color="white" stop-opacity="0"/>
<stop offset=".5" stop-color="#22D3EE" stop-opacity=".25"/>
<stop offset="1" stop-color="white" stop-opacity="0"/>
</linearGradient>

</defs>


<!-- Background -->
<rect width="1180" height="610"
rx="35"
fill="url(#bg)"/>


<!-- Floating glow -->
<circle cx="1000" cy="100"
r="180"
fill="#7C3AED"
opacity=".12"
filter="url(#glow)">
<animate attributeName="cy"
values="100;150;100"
dur="7s"
repeatCount="indefinite"/>
</circle>


<circle cx="180" cy="500"
r="150"
fill="#22D3EE"
opacity=".1"
filter="url(#glow)">
<animate attributeName="cx"
values="180;220;180"
dur="6s"
repeatCount="indefinite"/>
</circle>


<!-- LEFT ASCII PANEL -->

<rect x="45"
y="60"
width="360"
height="480"
rx="28"
fill="#0F172A"
stroke="rgba(255,255,255,.08)"
filter="url(#shadow)"/>


<text x="75"
y="130"
font-size="18"
font-family="monospace"
fill="url(#accent)">

<tspan>
 █████╗ ██████╗
</tspan>

<tspan x="75" dy="35">
██╔══██╗██╔══██╗
</tspan>

<tspan x="75" dy="35">
███████║██║  ██║
</tspan>

<tspan x="75" dy="35">
██╔══██║██║  ██║
</tspan>

<tspan x="75" dy="35">
██║  ██║██████╔╝
</tspan>

<tspan x="75" dy="35">
╚═╝  ╚═╝╚═════╝
</tspan>

<animate attributeName="opacity"
values="0;1"
dur="3s"/>

</text>


<!-- floating ASCII -->

<text x="90"
y="390"
font-family="monospace"
font-size="18"
fill="#94A3B8">

&lt; developer.mode /&gt;

<animateTransform
attributeName="transform"
type="translate"
values="0 0;0 -12;0 0"
dur="5s"
repeatCount="indefinite"/>

</text>



<!-- RIGHT TERMINAL -->

<rect x="450"
y="60"
width="680"
height="480"
rx="28"
fill="#0F172A"
stroke="#334155"
filter="url(#shadow)"/>


<!-- Terminal Header -->

<circle cx="490" cy="100" r="8" fill="#ef4444"/>
<circle cx="520" cy="100" r="8" fill="#facc15"/>
<circle cx="550" cy="100" r="8" fill="#22c55e"/>


<text x="600"
y="110"
fill="#94A3B8"
font-family="monospace"
font-size="16">

aditya@github-profile

</text>



<!-- Terminal Text -->

<text x="500"
y="170"
font-family="monospace"
font-size="28"
fill="#F8FAFC">

Hi 👋

<tspan x="500" dy="45"
fill="url(#accent)">
I'm Aditya Saxena
</tspan>

</text>


<text x="500"
y="280"
font-family="monospace"
font-size="22"
fill="#22D3EE">

Full Stack Developer

<animate attributeName="opacity"
values="1;.3;1"
dur="2s"
repeatCount="indefinite"/>

</text>



<text x="500"
y="340"
font-family="monospace"
font-size="18"
fill="#94A3B8">

Java • Node.js • MongoDB • JavaScript

</text>


<text x="500"
y="390"
font-family="monospace"
font-size="18"
fill="#94A3B8">

Building scalable web applications

<tspan>
_
</tspan>

<animate attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>

</text>



<!-- Scanline -->

<rect x="0"
width="1180"
height="80"
fill="url(#scan)"
opacity=".5">

<animate attributeName="y"
values="-80;610"
dur="5s"
repeatCount="indefinite"/>

</rect>


<!-- Border -->

<rect x="10"
y="10"
width="1160"
height="590"
rx="35"
fill="none"
stroke="url(#accent)"
stroke-width="2">

<animate attributeName="stroke-opacity"
values=".3;1;.3"
dur="4s"
repeatCount="indefinite"/>

</rect>


</svg>